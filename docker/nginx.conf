server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Public catalog API reverse proxies. Keeping calls same-origin avoids
  # browser CORS restrictions and centralizes upstream timeouts.
  location ^~ /api/catalog/productguru/ {
    proxy_pass https://myproduct.guru/lookup/;
    proxy_ssl_server_name on;
    proxy_set_header Host myproduct.guru;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  location ^~ /api/catalog/off/ {
    proxy_pass https://world.openfoodfacts.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host world.openfoodfacts.org;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  location ^~ /api/catalog/elid/ {
    proxy_pass https://elid.wine/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host elid.wine;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
